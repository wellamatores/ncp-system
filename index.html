<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE OS — Naval Command Post (NCP)</title>
    <!-- Leaflet CSS (local) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ---------- GLOBAL ---------- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ---------- HEADER ---------- */
        #header {
            background-color: #0a0a0a;
            padding: 8px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #header h1 { font-size: 1.4rem; letter-spacing: 1px; }
        #header h1 small { font-weight: normal; font-size: 0.8rem; color: #888; margin-left: 12px; }
        #role-indicator {
            background: #1e1e1e;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            font-weight: 600;
        }
        #role-indicator span { color: #ffaa33; }
        /* ---------- MAIN LAYOUT ---------- */
        #app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px);
            overflow: hidden;
        }
        #map-container {
            flex: 0 0 75%;
            position: relative;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
        }
        #dprk-grid-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            padding: 6px 12px;
            border-radius: 6px;
            backdrop-filter: blur(2px);
            border: 1px solid #444;
        }
        #dprk-grid-toggle button {
            background: #2a2a2a;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        #dprk-grid-toggle button:hover { background: #3d3d3d; }
        /* ---------- SIDEBAR ---------- */
        #sidebar {
            flex: 0 0 25%;
            background: #1a1a1a;
            padding: 12px 16px;
            overflow-y: auto;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #sidebar h2 {
            color: #ff9800;
            font-size: 1rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 4px;
            margin: 8px 0 6px 0;
            letter-spacing: 0.5px;
        }
        #sidebar h2:first-of-type { margin-top: 0; }
        .control-group {
            background: #141414;
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #252525;
        }
        input, select, button {
            background: #252525;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
            margin: 3px 0;
        }
        button {
            background: #2d2d2d;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
            border: 1px solid #3a3a3a;
        }
        button:hover { background: #3a3a3a; border-color: #555; }
        .btn-danger { background: #5a2a2a; border-color: #7a3a3a; }
        .btn-danger:hover { background: #7a2a2a; }
        .btn-success { background: #1e4a2a; border-color: #2a6a3a; }
        .btn-success:hover { background: #2a6a3a; }
        .btn-warning { background: #5a4a1a; border-color: #7a6a2a; }
        .btn-warning:hover { background: #7a6a2a; }

        #asset-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .asset-item {
            background: #1e1e1e;
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #888;
            font-size: 0.85rem;
        }
        .asset-item button {
            width: auto;
            padding: 2px 10px;
            background: #5a2a2a;
            border: none;
            border-radius: 3px;
            font-size: 0.75rem;
        }
        .asset-item button:hover { background: #7a2a2a; }

        #log-entries {
            background: #0d0d0d;
            height: 120px;
            overflow-y: auto;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #282828;
            margin: 4px 0 6px 0;
            font-family: monospace;
            font-size: 0.75rem;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a1a; color: #aaa; }
        .log-entry .time { color: #777; }
        .log-entry .role-tag { color: #ffaa33; }

        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .flex-row > * { flex: 1 1 auto; }

        /* role-based visibility */
        .role-observer .perm-add-asset,
        .role-observer .perm-add-zone,
        .role-observer .perm-autopilot { display: none !important; }

        .role-operator .perm-add-zone { display: none !important; }

        .role-commander .perm-add-zone { display: block !important; }
        .role-commander .perm-add-asset { display: block !important; }
        .role-commander .perm-autopilot { display: block !important; }

        .role-supreme .perm-add-zone { display: block !important; }
        .role-supreme .perm-add-asset { display: block !important; }
        .role-supreme .perm-autopilot { display: block !important; }

        /* grid label style */
        .grid-label { background: transparent; border: none; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div id="header">
        <h1>⚓ GATE OS — NCP <small>DPRK Naval Command</small></h1>
        <div id="role-indicator">👤 Role: <span id="current-role">Observer</span></div>
    </div>

    <!-- MAIN -->
    <div id="app-container">
        <!-- MAP -->
        <div id="map-container">
            <div id="map"></div>
            <div id="dprk-grid-toggle">
                <button id="toggle-grid">⊞ DPRK Grid</button>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div id="sidebar">
            <!-- ASSETS -->
            <div class="control-group">
                <h2>📡 Assets</h2>
                <div id="add-asset-form">
                    <input type="text" id="asset-id" placeholder="ID (e.g. vessel_01)" />
                    <select id="asset-type">
                        <option value="friendly_surface">Friendly Surface (blue)</option>
                        <option value="hostile_surface">Hostile Surface (red)</option>
                        <option value="neutral_surface">Neutral Surface (yellow)</option>
                        <option value="friendly_sub">Friendly Sub (purple)</option>
                        <option value="hostile_sub">Hostile Sub (orange)</option>
                        <option value="aircraft">Aircraft (white)</option>
                        <option value="coastal">Coastal (green)</option>
                    </select>
                    <select id="asset-status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="STANDBY">STANDBY</option>
                        <option value="DAMAGED">DAMAGED</option>
                        <option value="DESTROYED">DESTROYED</option>
                    </select>
                    <button id="add-asset" class="btn-success perm-add-asset">➕ Add Asset</button>
                </div>
                <ul id="asset-list"></ul>
            </div>

            <!-- ZONES -->
            <div class="control-group">
                <h2>🚧 Zones</h2>
                <div class="flex-row">
                    <button id="add-red-zone" class="btn-danger perm-add-zone">🔴 Red</button>
                    <button id="add-yellow-zone" class="btn-warning perm-add-zone">🟡 Yellow</button>
                    <button id="add-green-corridor" class="btn-success perm-add-zone">🟢 Green</button>
                </div>
            </div>

            <!-- ROUTES -->
            <div class="control-group">
                <h2>🗺️ Routes</h2>
                <div class="flex-row">
                    <button id="add-waypoint" class="perm-autopilot">📍 Add Waypoint</button>
                    <button id="start-autopilot" class="btn-success perm-autopilot">▶ Autopilot</button>
                </div>
                <p style="font-size:0.7rem; color:#888; margin:4px 0 0 0;">Select asset, click map for waypoints</p>
            </div>

            <!-- LOGS -->
            <div class="control-group" style="flex:1;">
                <h2>📜 Event Logs</h2>
                <div id="log-entries"></div>
                <button id="export-logs">⬇ Export CSV</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS (local) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- DPRK Grid & App -->
    <script>
        // ============================================================
        //  DPRK GRID OVERLAY
        // ============================================================
        L.DPRKGrid = L.Layer.extend({
            initialize: function(options) {
                L.setOptions(this, options);
                this._gridLines = [];
            },
            onAdd: function(map) {
                this._map = map;
                this._drawGrid();
                map.on('moveend', this._drawGrid, this);
            },
            onRemove: function(map) {
                map.off('moveend', this._drawGrid, this);
                this._clearGrid();
            },
            _drawGrid: function() {
                this._clearGrid();
                const bounds = this._map.getBounds();
                const zoom = this._map.getZoom();
                const spacing = zoom > 10 ? 0.1 : zoom > 5 ? 0.5 : 1.0;
                const sw = bounds.getSouthWest();
                const ne = bounds.getNorthEast();
                const lines = [];
                // vertical
                for (let lng = Math.floor(sw.lng); lng <= Math.ceil(ne.lng); lng += spacing) {
                    lines.push(L.polyline([[sw.lat, lng], [ne.lat, lng]], {
                        color: '#3a4a5a', weight: 1, opacity: 0.4, dashArray: '4 6'
                    }));
                }
                // horizontal
                for (let lat = Math.floor(sw.lat); lat <= Math.ceil(ne.lat); lat += spacing) {
                    lines.push(L.polyline([[lat, sw.lng], [lat, ne.lng]], {
                        color: '#3a4a5a', weight: 1, opacity: 0.4, dashArray: '4 6'
                    }));
                }
                lines.forEach(line => { line.addTo(this._map); this._gridLines.push(line); });
                // labels if zoom > 8
                if (zoom > 8) {
                    for (let lat = Math.floor(sw.lat); lat <= Math.ceil(ne.lat); lat += spacing) {
                        for (let lng = Math.floor(sw.lng); lng <= Math.ceil(ne.lng); lng += spacing) {
                            const marker = L.marker([lat, lng], {
                                icon: L.divIcon({
                                    className: 'grid-label',
                                    html: `<div style="color:#667;font-size:9px;text-shadow:0 0 6px #000;">${lat.toFixed(1)},${lng.toFixed(1)}</div>`,
                                    iconSize: [50, 14]
                                }),
                                interactive: false,
                                zIndexOffset: 1000
                            });
                            marker.addTo(this._map);
                            this._gridLines.push(marker);
                        }
                    }
                }
            },
            _clearGrid: function() {
                this._gridLines.forEach(layer => this._map.removeLayer(layer));
                this._gridLines = [];
            }
        });
        L.dprkGrid = function(options) { return new L.DPRKGrid(options); };

        // ============================================================
        //  APPLICATION
        // ============================================================
        (function() {
            // ---------- MAP ----------
            const map = L.map('map').setView([39.0, 125.7], 8);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: 'DPRK State Cartographic Data',
                minZoom: 4, maxZoom: 15
            }).addTo(map);

            let dprkGrid = L.dprkGrid().addTo(map);
            let gridVisible = true;

            // ---------- STATE ----------
            let assets = {};
            let assetMarkers = {};
            let selectedAssetId = null;
            let logs = [];
            let zones = { red: [], yellow: [], green: [] };

            // roles
            const roles = {
                Observer: { canAddAsset: false, canAddZone: false, canAutopilot: false },
                Operator: { canAddAsset: true, canAddZone: false, canAutopilot: true },
                Commander: { canAddAsset: true, canAddZone: true, canAutopilot: true },
                SupremeCommander: { canAddAsset: true, canAddZone: true, canAutopilot: true }
            };
            let currentRole = 'Observer';

            // ---------- HELPERS ----------
            function logEvent(msg) {
                const ts = new Date().toISOString().replace('T', ' ').slice(0, 19);
                const entry = `[${ts}] [${currentRole}] ${msg}`;
                logs.push(entry);
                renderLogs();
            }

            function renderLogs() {
                const container = document.getElementById('log-entries');
                container.innerHTML = '';
                logs.slice().reverse().forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    div.textContent = line;
                    container.appendChild(div);
                });
            }

            function updateRoleUI() {
                document.getElementById('current-role').textContent = currentRole;
                document.body.className = 'role-' + currentRole.toLowerCase();
                logEvent(`Role set to ${currentRole}`);
            }

            // ---------- ASSET RENDERING ----------
            function renderAsset(id) {
                const asset = assets[id];
                if (!asset) return;
                if (asset.marker) map.removeLayer(asset.marker);
                const color = asset.color || '#888';
                const icon = L.divIcon({
                    className: 'asset-marker',
                    html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,0.8);"></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });
                const marker = L.marker([asset.lat, asset.lng], { icon, draggable: true })
                    .addTo(map)
                    .bindPopup(`<b>${id}</b><br>${asset.type.replace('_',' ')}<br>${asset.status}`);
                marker.on('dragend', function(e) {
                    const pos = e.target.getLatLng();
                    asset.lat = pos.lat;
                    asset.lng = pos.lng;
                    logEvent(`Moved ${id} to ${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`);
                });
                marker.on('click', function() {
                    selectedAssetId = id;
                    logEvent(`Selected ${id}`);
                });
                asset.marker = marker;
                // route line
                if (asset.route && asset.route.length > 1) {
                    if (asset.routeLine) map.removeLayer(asset.routeLine);
                    asset.routeLine = L.polyline(asset.route, { color, weight: 2, opacity: 0.7 }).addTo(map);
                }
            }

            function updateAssetList() {
                const ul = document.getElementById('asset-list');
                ul.innerHTML = '';
                for (const [id, asset] of Object.entries(assets)) {
                    const li = document.createElement('li');
                    li.className = 'asset-item';
                    li.style.borderLeftColor = asset.color || '#888';
                    li.innerHTML = `
                        <span><strong>${id}</strong> ${asset.status}</span>
                        <button onclick="window.removeAsset('${id}')">✕</button>
                    `;
                    ul.appendChild(li);
                }
            }

            // ---------- ASSET CRUD ----------
            function addAsset(id, type, status) {
                if (!roles[currentRole].canAddAsset) {
                    logEvent(`UNAUTHORIZED: add asset by ${currentRole}`);
                    return;
                }
                if (assets[id]) { logEvent(`Asset ${id} already exists`); return; }
                const typeMap = {
                    friendly_surface: '#3388ff', hostile_surface: '#ff3333',
                    neutral_surface: '#ffcc00', friendly_sub: '#aa44ff',
                    hostile_sub: '#ff8833', aircraft: '#dddddd', coastal: '#33cc33'
                };
                const color = typeMap[type] || '#888';
                const asset = {
                    lat: map.getCenter().lat + (Math.random()-0.5)*0.3,
                    lng: map.getCenter().lng + (Math.random()-0.5)*0.3,
                    type, status, color,
                    marker: null,
                    route: [],
                    routeLine: null
                };
                assets[id] = asset;
                renderAsset(id);
                updateAssetList();
                logEvent(`Added ${id} (${type}) status:${status}`);
            }

            window.removeAsset = function(id) {
                if (!assets[id]) return;
                if (assets[id].marker) map.removeLayer(assets[id].marker);
                if (assets[id].routeLine) map.removeLayer(assets[id].routeLine);
                delete assets[id];
                updateAssetList();
                logEvent(`Removed ${id}`);
            };

            // ---------- ZONES ----------
            function addZone(type, color) {
                if (!roles[currentRole].canAddZone) {
                    logEvent(`UNAUTHORIZED: add ${type} zone by ${currentRole}`);
                    return;
                }
                const points = [];
                const poly = L.polygon([], { color, fillColor: color, fillOpacity: 0.2, weight: 2 });
                poly.addTo(map);
                zones[type].push(poly);
                logEvent(`Started drawing ${type} zone (click map to add points)`);
                const clickHandler = function(e) {
                    points.push(e.latlng);
                    poly.setLatLngs(points);
                    if (points.length > 2) {
                        map.off('click', clickHandler);
                        logEvent(`Added ${type} zone with ${points.length} points`);
                    }
                };
                map.on('click', clickHandler);
            }

            // ---------- ROUTE / WAYPOINT ----------
            function addWaypoint() {
                if (!selectedAssetId) { alert('Select an asset first!'); return; }
                if (!roles[currentRole].canAutopilot) {
                    logEvent(`UNAUTHORIZED: add waypoint by ${currentRole}`);
                    return;
                }
                const asset = assets[selectedAssetId];
                if (!asset) return;
                logEvent(`Click map to add waypoint for ${selectedAssetId}`);
                const clickHandler = function(e) {
                    const latlng = e.latlng;
                    asset.route.push([latlng.lat, latlng.lng]);
                    if (asset.routeLine) map.removeLayer(asset.routeLine);
                    asset.routeLine = L.polyline(asset.route, { color: asset.color, weight: 2 }).addTo(map);
                    logEvent(`Waypoint added for ${selectedAssetId} at ${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
                    map.off('click', clickHandler);
                };
                map.on('click', clickHandler);
            }

            function startAutopilot() {
                if (!selectedAssetId) { alert('Select an asset'); return; }
                if (!roles[currentRole].canAutopilot) {
                    logEvent(`UNAUTHORIZED: autopilot by ${currentRole}`);
                    return;
                }
                const asset = assets[selectedAssetId];
                if (!asset || asset.route.length === 0) { alert('No waypoints set'); return; }
                let idx = 0;
                logEvent(`Autopilot started for ${selectedAssetId}`);
                const interval = setInterval(() => {
                    if (idx >= asset.route.length) {
                        clearInterval(interval);
                        logEvent(`Autopilot finished for ${selectedAssetId}`);
                        return;
                    }
                    const target = asset.route[idx];
                    const current = asset.marker.getLatLng();
                    const newLat = current.lat + (target[0] - current.lat) * 0.1;
                    const newLng = current.lng + (target[1] - current.lng) * 0.1;
                    asset.marker.setLatLng([newLat, newLng]);
                    asset.lat = newLat;
                    asset.lng = newLng;
                    if (Math.abs(newLat - target[0]) < 0.005 && Math.abs(newLng - target[1]) < 0.005) {
                        idx++;
                        logEvent(`${selectedAssetId} reached waypoint ${idx}`);
                    }
                }, 800);
            }

            // ---------- EXPORT ----------
            function exportLogs() {
                let csv = 'Timestamp,Role,Event\n';
                logs.forEach(line => {
                    const parts = line.match(/\[(.*?)\]\s\[(.*?)\]\s(.*)/);
                    if (parts) csv += `"${parts[1]}","${parts[2]}","${parts[3]}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ncp_logs_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                logEvent('Exported logs CSV');
            }

            // ---------- INIT SAMPLE ASSETS ----------
            function initSampleAssets() {
                const sample = {
                    vessel_01: { lat: 39.1, lng: 125.6, type: 'friendly_surface', status: 'ACTIVE', color: '#3388ff' },
                    sub_02: { lat: 38.7, lng: 126.2, type: 'friendly_sub', status: 'STANDBY', color: '#aa44ff' },
                    hostile_03: { lat: 39.4, lng: 126.8, type: 'hostile_surface', status: 'ACTIVE', color: '#ff3333' }
                };
                for (const [id, data] of Object.entries(sample)) {
                    assets[id] = {
                        ...data,
                        marker: null,
                        route: [],
                        routeLine: null
                    };
                    renderAsset(id);
                }
                updateAssetList();
            }

            // ---------- EVENT BINDING ----------
            document.getElementById('toggle-grid').addEventListener('click', function() {
                gridVisible = !gridVisible;
                if (gridVisible) dprkGrid.addTo(map);
                else map.removeLayer(dprkGrid);
                logEvent(`DPRK Grid ${gridVisible ? 'enabled' : 'disabled'}`);
            });

            document.getElementById('add-asset').addEventListener('click', function() {
                const id = document.getElementById('asset-id').value.trim();
                const type = document.getElementById('asset-type').value;
                const status = document.getElementById('asset-status').value;
                if (!id) { alert('Enter asset ID'); return; }
                addAsset(id, type, status);
                document.getElementById('asset-id').value = '';
            });

            document.getElementById('add-red-zone').addEventListener('click', () => addZone('red', '#ff3333'));
            document.getElementById('add-yellow-zone').addEventListener('click', () => addZone('yellow', '#ffcc00'));
            document.getElementById('add-green-corridor').addEventListener('click', () => addZone('green', '#33cc33'));

            document.getElementById('add-waypoint').addEventListener('click', addWaypoint);
            document.getElementById('start-autopilot').addEventListener('click', startAutopilot);
            document.getElementById('export-logs').addEventListener('click', exportLogs);

            // ---------- ROLE SWITCH (demo via console) ----------
            window.setRole = function(role) {
                if (roles[role]) {
                    currentRole = role;
                    updateRoleUI();
                } else console.warn('Invalid role');
            };

            // ---------- BOOT ----------
            initSampleAssets();
            updateRoleUI();
            logEvent('System initialized');

            // expose for testing
            window.map = map;
            window.assets = assets;
            window.logEvent = logEvent;
        })();
    </script>
</body>
</html>
